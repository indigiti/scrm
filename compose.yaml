services:
  schoolflow:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # reverse-proxy HTTPS in production
    environment:
      SCHOOLFLOW_DB: /data/schoolflow.sqlite3
    volumes:
      - schoolflow_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  schoolflow_data:
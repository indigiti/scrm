name: DigiOps Release - SchoolFlow CRM
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Comprehensive shared regression and release validation
        run: bash tools/run-regressions.sh
      - name: Upload DigiOps deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: dist/digiops-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

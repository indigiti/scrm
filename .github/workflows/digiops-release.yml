name: DigiOps Release - SchoolFlow CRM
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: PHP source syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' phpfile; do php -l "$phpfile"; done < <(find app_private bin public_html tests tools wordpress -name '*.php' -print0)
      - name: API smoke tests
        run: |
          php tests/test_smoke.php
          php tests/test_setup.php
          php tests/test_web_setup.php
          php tests/test_demo.php
          php tests/test_audit.php
          php tests/test_schoolflow_v2.php
          php tests/test_multischool_routing.php
          php tests/test_cf7_multischool.php
          php tests/test_group_routing.php
          php tests/test_release_audit.php
          php tests/test_admission_classification.php
          php tests/test_admissions_tasks.php
          php tests/test_admissions_analytics.php
          php tests/test_admissions_automation.php
          php tests/test_admissions_post_audit.php
          php tests/test_admissions_schedule_revision.php
          php tests/test_admissions_export_xlsx.php
          php tests/test_public_forms.php
          php tests/test_cf7_group.php
      - name: JavaScript syntax and UI smoke checks
        run: |
          node --check public_html/static/app.js
          node --check public_html/static/lexicon-form.js
          node tests/check_frontend_v2.js
          node tests/check_group_routing.js
      - name: Build DigiOps public payload
        run: php tools/build-digiops.php
      - name: HTTP JSON object regression test
        run: php tests/test_http_json.php
      - name: Layout / drawer CSS regression check
        run: php tests/test_layout.php
      - name: CSP / external-script regression check
        run: php tests/test_csp.php
      - name: Validate bundled gateway
        shell: bash
        run: |
          set -euo pipefail
          php -l dist/digiops-release/index.php
          test -f dist/digiops-release/.htaccess
          test -f dist/digiops-release/static/app.js
          test -f dist/digiops-release/static/lexicon-form.js
          test -f dist/digiops-release/static/lexicon-form.css
          ! grep -Eq "require_once.*(app_private|messaging.php)" dist/digiops-release/index.php
          ! grep -q '/static/app.js' dist/digiops-release/static/index.html || grep -q '/scrm/static/app.js' dist/digiops-release/static/index.html
          ! find dist/digiops-release -type f \( -name '*.json' -o -name '*password*' -o -name '*.env' \) | grep .
      - name: Upload DigiOps deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: dist/digiops-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

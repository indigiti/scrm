name: Public Form PR Checks
on:
  pull_request:
    paths:
      - '.github/workflows/public-form-ci.yml'
      - 'app_private/**'
      - 'public_html/**'
      - 'tests/**'
      - 'tools/build-digiops.php'
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: |
          set -euo pipefail
          find app_private public_html tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify public-only DigiOps payload
        run: |
          php tools/build-digiops.php
          php -l dist/digiops-release/index.php
          test -f dist/digiops-release/static/lexicon-form.js
          test -f dist/digiops-release/static/lexicon-form.css
          test -f dist/digiops-release/static/schoolflow-short-form.js
          test -f dist/digiops-release/static/schoolflow-short-form.css
          ! find dist/digiops-release -type f \( -name '*.json' -o -name '*.key' -o -name '*.env' \) | grep .
      - name: Regression suite
        run: |
          set -euo pipefail
          for test in tests/test_*.php; do php "$test"; done
      - name: JavaScript checks
        run: |
          node --check public_html/static/app.js
          node --check public_html/static/lexicon-form.js
          node --check public_html/static/schoolflow-short-form.js
          node tests/check_frontend_v2.js
          node tests/check_group_routing.js
          node tests/check_lexicon_chat_autoload.js
          node tests/check_conversational_chat.js
          node tests/check_chatbot_leads_navigation.js

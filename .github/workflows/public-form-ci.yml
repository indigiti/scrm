name: Public Form PR Checks
on:
  pull_request:
    paths:
      - '.github/workflows/public-form-ci.yml'
      - '.github/workflows/digiops-release.yml'
      - 'app_private/**'
      - 'bin/**'
      - 'public_html/**'
      - 'tests/**'
      - 'tools/**'
      - 'wordpress/**'
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Comprehensive shared regression and release validation
        run: bash tools/run-regressions.sh
